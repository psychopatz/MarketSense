[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketsense-offline"
version = "0.1.0"
description = "Offline Project Zomboid MarketSense Workshop inspection harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
marketsense-offline = "marketsense_app.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "marketsense_app_test_support" = "tests/marketsense_app_test_support"}
packages = ["marketsense_app", "marketsense_app.testing", "marketsense_app_test_support"]

[tool.setuptools.package-data]
marketsense_app = ["*.lua"]
